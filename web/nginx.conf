# Static server for the built SPA, inside the web container.
#
# SECURITY HEADERS. Every location that serves an HTML page includes
# /etc/nginx/zenoeats/*.conf, which the entrypoint writes at start with the
# Content-Security-Policy for this environment. It has to be included per
# location, not once for the server: any add_header inside a location (the
# Cache-Control lines below) discards every add_header inherited from the
# server block, so a server-level policy would silently never be sent. The
# include is a wildcard so a missing file is not an error.
#
# Listens on 3000 so the edge (infra/nginx/nginx.conf) proxies to the same
# port in production as it does to the Vite dev server in development. One
# edge config serves both modes.
# The version number tells a scanner which advisories to try first.
server_tokens off;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # The API is a separate upstream; this container never sees /api. If a
    # request arrives here anyway, fail loudly rather than answering it with
    # index.html, which would hand JavaScript to something expecting JSON.
    location /api/ {
        return 404;
    }

    # Hashed filenames. The content of a given URL can never change, so this
    # is safe to cache permanently.
    location /assets/ {
        # One directive, not `expires 1y` plus add_header: those emit two
        # separate Cache-Control lines for the same response.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The login pages are real files, not React routes. try_files must not
    # fall through to index.html here: serving the SPA at /login/admin-login
    # .html would silently replace the credential form with the app shell,
    # and the failure would look like a blank page rather than a 404.
    location /login/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files $uri =404;
    }

    # /admin/login, /manage/login and /manage/change-password are the URLs the
    # app redirects an unauthenticated operator to, and the ones the previous
    # build published. Their files are login/*.html. Without these three the
    # SPA fallback below answers them with the app shell and React renders
    # "Page not found" -- a dead end with no way to sign in.
    location = /admin/login {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /login/admin-login.html =404;
    }

    location = /manage/login {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /login/staff-login.html =404;
    }

    location = /manage/change-password {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /login/change-password.html =404;
    }

    # Customer sign-in, sign-up and password reset. Same reasoning: real files,
    # never the SPA shell.
    location = /account/sign-in {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /login/customer-sign-in.html =404;
    }

    location = /account/sign-up {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /login/customer-sign-up.html =404;
    }

    location = /account/forgot-password {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /login/customer-forgot-password.html =404;
    }

    # The policy pages. Real files again, and for a reason the sign-in pages
    # do not have: Google, Apple and Facebook will not approve sign-in until
    # these URLs resolve publicly, and the reviewer fetching them is not
    # running JavaScript. They must also answer on the root domain, which
    # belongs to no restaurant -- these are files on disk, so they do, while
    # anything the SPA served there would find no tenant.
    location = /legal/privacy {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /legal/privacy.html =404;
    }

    location = /legal/terms {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /legal/terms.html =404;
    }

    location = /legal/refunds {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /legal/refunds.html =404;
    }

    location = /legal/data-deletion {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files /legal/data-deletion.html =404;
    }

    # Everything else is a client-side route -- /, /checkout, /orders/:id,
    # /manage/*, /admin/*. They have no file on disk, so they resolve to the
    # app shell and React Router takes over.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/zenoeats/*.conf;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
