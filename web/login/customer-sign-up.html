<!doctype html>
<html lang="en" data-surface="customer">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account</title>
    <link rel="stylesheet" href="/src/styles/globals.css" />
  </head>
  <body>
    <main class="auth">
      <aside class="auth-art" aria-hidden="true">
        <div class="auth-brand"><span class="brand-mark" data-wordmark-mark>Z</span><span data-wordmark-name>Zenoeats</span></div>
        <!-- A photograph rather than the drawn cloche. The panel was a flat
             colour with a small illustration on it, which read as a
             placeholder next to a storefront full of real food. The image is
             behind the type, dimmed by .auth-art::after, so the caption
             stays legible wherever the photo is bright. -->
        <img class="auth-art-photo" src="/auth-art.webp" alt="" />
        <div class="relative z-section">
          <p class="auth-art-caption">Good food.<br />A little closer.</p>
        </div>
        <p class="auth-art-foot text-caption">From their kitchen to your hands.</p>
      </aside>

      <section class="auth-form">
        <a class="back-link" href="/">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          Back to the menu
        </a>
        <a class="auth-brand" href="/" aria-label="Back to the menu"><span class="brand-mark" aria-hidden="true" data-wordmark-mark>Z</span><span data-wordmark-name>Zenoeats</span></a>
        <h1>Create an account</h1>

        <p id="error" class="note-error mb-5" role="alert" hidden></p>

        <section id="form-section">
          <p class="auth-intro">
            Your orders, your details and your favourites, kept for next time.
          </p>

          <!-- One button per provider with credentials behind it (Google, Apple,
               Facebook), rendered by customer-shared.ts. Hidden when there are none. -->
          <section id="social-section" class="mb-[17px]" hidden>
            <div id="social-buttons" class="flex flex-col gap-[9px]"></div>
            <div class="divider mt-[17px]">or</div>
          </section>

          <form id="sign-up-form" class="auth-stack" novalidate>
            <label id="name-field" class="block">
              <span class="label">Name <span class="font-normal text-muted">(optional)</span></span>
              <input id="full-name" class="field mt-[7px]" type="text" autocomplete="name" maxlength="160" />
            </label>

            <label class="block">
              <span class="label">Email</span>
              <input id="email" class="field mt-[7px]" type="email" autocomplete="email" required />
            </label>

            <label class="block">
              <span class="label">Password</span>
              <input id="password" class="field mt-[7px]" type="password" autocomplete="new-password" required aria-describedby="length-hint" />
              <span id="length-hint" class="mt-2 block text-caption text-muted"></span>
            </label>

            <label class="block">
              <span class="label">Confirm password</span>
              <input id="confirm" class="field mt-[7px]" type="password" autocomplete="new-password" required aria-describedby="match-hint" />
              <span id="match-hint" class="mt-2 block text-caption text-danger" hidden>These do not match.</span>
            </label>

            <!-- Agreement, asked for here rather than implied by the button.
                 It gates the provider buttons above as well as this form. -->
            <label id="legal-field" class="flex min-h-[40px] items-start gap-2.5 text-sm">
              <input id="legal" class="mt-0.5 h-5 w-5 shrink-0" type="checkbox" required />
              <span
                >I agree to the
                <a href="/legal/terms" target="_blank" rel="noopener" class="underline">Terms of Service</a>
                and
                <a href="/legal/privacy" target="_blank" rel="noopener" class="underline">Privacy Policy</a>.</span
              >
            </label>

            <button id="submit" class="btn-primary w-full" type="submit" disabled>Create account</button>
          </form>

          <p class="auth-foot">
            Already have an account?
            <a id="sign-in" class="text-ink underline underline-offset-[3px]" href="/account/sign-in">Sign in</a>
          </p>
        </section>

      </section>
    </main>

    <script type="module" src="/login/customer-sign-up.ts"></script>
  </body>
</html>
