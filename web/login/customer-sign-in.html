<!doctype html>
<html lang="en" data-surface="customer">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to order</title>
    <!-- Render-blocking on purpose, as on the portal login pages: a link in the
         head blocks first paint until the stylesheet lands, instead of
         painting unstyled while the script graph loads. -->
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <!-- Runtime configuration (the Clerk publishable key), written by the web
         container at startup. A classic script, so it runs before the module
         entry below reads it. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <main class="auth">
      <!-- Decoration beside the form from 1024px up. Static: no motion. -->
      <aside class="auth-art" aria-hidden="true">
        <div class="auth-brand"><span class="brand-mark" data-wordmark-mark>Z</span><span data-wordmark-name>Zenoeats</span></div>
        <!-- A photograph rather than the drawn cloche. The panel was a flat
             colour with a small illustration on it, which read as a
             placeholder next to a storefront full of real food. The image is
             behind the type, dimmed by .auth-art::after, so the caption
             stays legible wherever the photo is bright. -->
        <img class="auth-art-photo" src="/auth-art.webp" alt="" />
        <div class="relative z-section">
          <p class="auth-art-caption">Good food.<br />A little closer.</p>
        </div>
        <p class="auth-art-foot text-caption">From their kitchen to your hands.</p>
      </aside>

      <section class="auth-form">
        <a class="back-link" href="/">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          Back to the menu
        </a>
        <a class="auth-brand" href="/" aria-label="Back to the menu"><span class="brand-mark" aria-hidden="true" data-wordmark-mark>Z</span><span data-wordmark-name>Zenoeats</span></a>
        <h1 id="heading">Sign in to order</h1>
        <p id="error" class="note-error mb-5" role="alert" hidden></p>

        <section id="password-section">

          <!-- One button per social sign-in switched on in Clerk (Google, Apple,
               Facebook), rendered by customer-shared.ts. Hidden when there are none. -->
          <section id="social-section" class="mb-[17px]" hidden>
            <div id="social-buttons" class="flex flex-col gap-[9px]"></div>
            <div class="divider mt-[17px]">or</div>
          </section>

          <form id="login-form" class="auth-stack" novalidate>
            <label class="block">
              <span class="label">Email</span>
              <input id="email" class="field mt-[7px]" type="email" autocomplete="username" required />
            </label>

            <label class="block">
              <span class="label flex items-baseline justify-between">
                Password
                <a id="forgot" class="text-caption font-normal text-muted underline underline-offset-[3px] hover:text-ink" href="/account/forgot-password">Forgot password?</a>
              </span>
              <input id="password" class="field mt-[7px]" type="password" autocomplete="current-password" required />
            </label>

            <button id="submit" class="btn-primary w-full" type="submit" disabled>Sign in</button>
          </form>

          <p class="auth-foot">
            New here?
            <a id="sign-up" class="text-ink underline underline-offset-[3px]" href="/account/sign-up">Create an account</a>
          </p>

          <!-- Ordering without an account, last and behind a press.
               The order of this page is the one a customer expects: a
               provider, then an account, then the way through without one.
               Guest is a button rather than a third open form -- two
               complete forms at once showed four fields and two submit
               buttons and left the reader to work out which pair was theirs.

               Shown once a restaurant is known: a guest session belongs to
               the restaurant being ordered from, so on the platform root
               there is nothing to be a guest of. It never waits on an
               identity provider -- this is the way through when none is
               configured. -->
          <section id="guest-section" class="mt-[22px] border-t border-hairline pt-[22px] sm:mt-[26px] sm:pt-[26px]" aria-labelledby="guest-heading" hidden>
            <h2 id="guest-heading" class="sr-only">Order without an account</h2>

            <button id="guest-reveal" type="button" class="btn-quiet w-full" aria-expanded="false" aria-controls="guest-form">
              Continue as a guest
            </button>
            <p id="guest-why" class="mt-2.5 text-center text-caption text-muted">
              No account, no password — just an email for your receipt.
            </p>


            <p id="guest-error" class="note-error mt-4" role="alert" hidden></p>

            <form id="guest-form" class="auth-stack mt-4" novalidate hidden>
              <label class="block">
                <span class="label text-caption">Email</span>
                <input id="guest-email" class="field mt-[7px]" type="email" autocomplete="email" required />
              </label>

              <label class="block">
                <span class="label text-caption">
                  Name <span class="font-normal text-muted">(optional)</span>
                </span>
                <input id="guest-name" class="field mt-[7px]" type="text" autocomplete="name" maxlength="160" />
              </label>

              <button id="guest-submit" class="btn-primary w-full" type="submit">
                Start my order
              </button>
            </form>
          </section>

        </section>

        <!-- The second step of signing in, when Clerk asks for one: an
             authenticator app, a text message, an emailed code (also what a
             new device is asked for), or a backup code. customer-sign-in.ts
             fills in the wording for whichever it is, and offers the others. -->
        <section id="code-section" hidden>
          <p id="code-intro" class="auth-intro"></p>
          <form id="code-form" class="auth-stack" novalidate>
            <label class="block">
              <span id="code-label" class="label">Verification code</span>
              <input id="code" class="field code-input mt-[7px]" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required />
            </label>
            <button id="code-submit" class="btn-primary w-full" type="submit">Continue</button>
          </form>
          <div id="code-alternatives" class="mt-4 flex flex-col items-start"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/login/customer-sign-in.ts"></script>
  </body>
</html>
