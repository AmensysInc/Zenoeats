name: CI

on:
  push:
    branches: [main, dev]
    # A release is cut by tagging. Without this the tag would build nothing
    # and there would be no image to deploy from it.
    tags: ["v*"]
  pull_request:
  # Everything, once a week. A change only audits the dependencies it touches,
  # so this is what notices a vulnerability published against a pin nobody moved.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A new push to a pull request replaces the run still going for the old one.
# Never on main or a tag, where a run is what publishes the images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job says otherwise. Only the docker job, which publishes
# images, asks for more. Without this line every job ran with whatever the
# repository's default token permissions were.
#
# Actions are pinned to a full commit SHA, with the version in a comment. A
# tag such as v4 can be moved to different code by whoever controls that
# repository; a SHA cannot. Dependabot (.github/dependabot.yml) proposes
# updates to them.
permissions:
  contents: read

jobs:
  # What this change touched, which decides what runs below. Anything that
  # cannot be worked out runs everything: a slow build is better than a skipped
  # test. Mapping and the reasons for it: scripts/ci_changes.sh.
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.detect.outputs.base }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      migrations: ${{ steps.detect.outputs.migrations }}
      python_deps: ${{ steps.detect.outputs.python_deps }}
      web_deps: ${{ steps.detect.outputs.web_deps }}
      api_image: ${{ steps.detect.outputs.api_image }}
      web_image: ${{ steps.detect.outputs.web_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          # A pull request is checked out as its merge commit, whose first
          # parent is the target branch, so this is the whole pull request.
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
          elif [ "$EVENT" = "push" ] && [[ "$REF" != refs/tags/* ]]; then
            base="$BEFORE"
          fi
          # A new branch has no "before", and a force push may have lost it.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Changed since $base:"
            git diff --name-only "$base" HEAD | tee changed.txt
            bash scripts/ci_changes.sh < changed.txt | tee -a "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          else
            echo "No base to compare with; running everything."
            bash scripts/ci_changes.sh --all | tee -a "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

  # A key committed by mistake is published the moment it is pushed: this
  # repository is public. High and critical only -- publishable keys, which
  # are public by design, are low.
  #
  # Always runs, because any file can carry a key, but over the changed files
  # alone. The weekly run and a release tag scan the whole repository.
  secrets:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Secret scan
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          target="$PWD"
          if [ -n "$BASE" ]; then
            target="$(mktemp -d)"
            # Not deleted files: there is nothing left to copy.
            git diff --name-only --diff-filter=d -z "$BASE" HEAD \
              | xargs -0 -r cp --parents -t "$target"
          fi
          docker run --rm -v "$target:/src:ro" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 fs \
            --scanners secret --severity HIGH,CRITICAL --exit-code 1 --no-progress /src

  backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: zenoeats
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_pw
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]

      # The driver's position on the tracking map is kept in Redis, so the
      # tests that read it need a real one. Two instances in production, for
      # reasons that matter there and not here (one evicts, one must never);
      # one instance with two databases is enough to run against.
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["6379:6379"]

    # Everything app/config.py has no usable default for. A developer gets
    # these from the .env at the repository root, which is not committed and
    # is not here -- so anything missing shows up as a test failure that makes
    # no sense, like "HMAC key must not be empty" on 238 tests at once.
    #
    # None of these values is a secret. They exist so the code under test has
    # something well-formed to work with, and they are deliberately worded so
    # that a copy of one turning up anywhere real is obvious.
    env:
      PGPASSWORD: postgres_dev_pw
      DATABASE_URL_APP: postgresql+psycopg2://zenoeats_app:app_dev_pw@localhost:5432/zenoeats
      DATABASE_URL_SYSTEM: postgresql+psycopg2://zenoeats_system:system_dev_pw@localhost:5432/zenoeats
      DATABASE_URL_MIGRATE: postgresql+psycopg2://zenoeats_migrate:migrate_dev_pw@localhost:5432/zenoeats
      FIELD_ENCRYPTION_KEY: kZ0nQx3Yk8vJ9pL2mN7bR4tS6wU1cE5gH8jK0aD3fI4=
      ROOT_DOMAIN: zenoeats.local
      # Signs staff, platform-admin and guest sessions. Without it every test
      # that issues one fails inside PyJWT rather than anywhere informative.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-real-000
      REDIS_RUNTIME_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # The webhook tests sign an event with this and post it, so what it is
      # does not matter -- only that both sides agree and it is not empty,
      # which Stripe's verifier refuses outright.
      STRIPE_CONNECT_WEBHOOK_SECRET: whsec_ci_only_not_a_real_endpoint_secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      # A dependency with a published vulnerability fails the build here,
      # rather than waiting for someone to remember to look. The pins in
      # requirements.txt were last cleared against this check; when it fails,
      # upgrade the named package and let the test suite below judge it.
      - name: Dependency vulnerability audit
        if: needs.changes.outputs.python_deps == 'true'
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Create database roles
        run: psql -h localhost -U postgres -d zenoeats -f infra/postgres/01-roles.sql

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      # Before the tests, on the empty schema they are about to fill, because
      # what this proves is that the chain of migrations is internally
      # consistent -- every upgrade has a downgrade that undoes it.
      #
      # It deliberately does not prove that a downgrade is safe over real
      # data, and it cannot: 0002 is what lets a user exist without an outside
      # identity, so undoing it deletes every staff member and platform admin, and
      # seven foreign keys point at users. A rollback of a live database is a
      # decision made against that database, not something a pipeline can
      # sign off (see docs/operations/STEPS_BEFORE_PRODUCTION.md, "Backups and recovery").
      #
      # Run after the suite instead and it fails on the rows the suite left
      # behind, which says nothing about the migrations.
      - name: Migration is reversible
        if: needs.changes.outputs.migrations == 'true'
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      # These four gates are the reason this pipeline exists. A green build
      # without them is not evidence of tenant isolation.
      - name: Tenant isolation and privilege gates
        working-directory: backend
        run: pytest tests/test_rls_isolation.py -v

      - name: Unit tests
        working-directory: backend
        run: pytest tests/ -v --ignore=tests/test_rls_isolation.py

  frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # tsconfig.json has more readers than tsc, and they do not agree on what
      # the file is. TypeScript parses it as JSONC and accepts // comments;
      # plenty of other tooling reaches for an ordinary JSON parser, where a
      # comment is a syntax error. So a comment here stays invisible to every
      # command in this job and throws somewhere else entirely. Keep the
      # configuration valid strict JSON and the question never comes up.
      - name: Config files are valid strict JSON
        run: node -e "for (const f of ['tsconfig.json','package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"

      - run: npm ci
      # Runtime dependencies only: they are what ships to browsers. Build
      # tooling advisories (a dev server, a linter) do not reach customers and
      # would otherwise fail builds over code that never runs in production.
      - name: Dependency vulnerability audit
        if: needs.changes.outputs.web_deps == 'true'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      # The storefront's presentation and the calorie arithmetic, rendered
      # and asserted without a browser. They were written but never run here,
      # so nothing stopped a change from breaking them.
      - name: Web tests
        run: node --test tests/*.test.mjs
      - run: npm run build

      # Rollup once dead-code-eliminated the entire application, because an
      # unset build-time key made a condition statically true. The build still
      # succeeded and shipped only an error page. Assert the app is actually
      # in the bundle rather than trusting the exit code.
      - name: Bundle contains the application
        run: |
          test -f dist/index.html
          test -f dist/login/admin-login.html
          test -f dist/login/staff-login.html
          test -f dist/login/change-password.html
          test -f dist/login/customer-sign-in.html
          test -f dist/login/customer-sign-up.html
          test -f dist/login/customer-forgot-password.html
          # Google, Apple and Facebook will not approve sign-in while any of
          # these 404s, and a missing Vite entry is silent -- the build still
          # succeeds, the page is simply not in dist.
          test -f dist/legal/privacy.html
          test -f dist/legal/terms.html
          test -f dist/legal/refunds.html
          test -f dist/legal/data-deletion.html
          grep -rq "Waiting for the payment confirmation" dist/assets/
          grep -rq "Zenoeats platform" dist/

      # The page a QR code opens must not carry the two operator portals.
      #
      # Nothing about this is visible in review. One static import from the
      # shell -- a guard, a shared component, a helper that looked harmless --
      # merges them back into the first load, the build still succeeds, and
      # the only symptom is a customer on restaurant wifi waiting longer.
      - name: The customer's first load stays small
        run: |
          set -euo pipefail
          # Both portals exist, and as chunks of their own.
          ls dist/assets/ManageArea-*.js >/dev/null
          ls dist/assets/AdminArea-*.js >/dev/null
          # And the entry does not reach for either of them.
          if grep -qE 'ManageArea|AdminArea' dist/index.html; then
            echo "index.html pulls in an operator portal; the split has regressed" >&2
            exit 1
          fi
          # A budget on the entry chunk, generous enough never to nag: it sits
          # near 70 kB, and merging a portal back in would put it past 350.
          bytes=$(stat -c%s dist/assets/app-*.js)
          echo "entry chunk: $((bytes / 1024)) kB"
          test "$bytes" -lt 204800

  # Build once, tag by commit, promote the SAME image from staging to
  # production. Never rebuild between environments (rule 12).
  #
  # A pull request builds and throws the result away: that proves the
  # Dockerfiles still work without publishing an image from code nobody has
  # merged. A push to main, or a version tag, publishes to GHCR.
  #
  # Only the image whose code changed: a commit on main that touches the web
  # alone publishes no api image under its sha. A version tag always builds both,
  # so a release names a complete pair.
  #
  # A job whose `needs` was skipped is skipped too unless told otherwise, so this
  # says what it means: nothing failed, and there is an image to build.
  docker:
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.changes.outputs.api_image == 'true' || needs.changes.outputs.web_image == 'true')
    env:
      BUILD_API: ${{ needs.changes.outputs.api_image }}
      BUILD_WEB: ${{ needs.changes.outputs.web_image }}
    permissions:
      contents: read
      # What lets GITHUB_TOKEN write to ghcr.io. No registry secret to store,
      # rotate or leak -- the token is minted per run and dies with it.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ghcr.io rejects an uppercase path, and a GitHub owner may contain
      # capitals, so the name is lowered here rather than assumed.
      - name: Work out the image names
        run: |
          echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          images=""
          if [ "$BUILD_API" = "true" ]; then images="api"; fi
          if [ "$BUILD_WEB" = "true" ]; then images="$images web"; fi
          echo "IMAGES=$images" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            context=web
            if [ "$image" = "api" ]; then context=backend; fi
            docker build -t "$IMAGE_BASE/$image:${{ github.sha }}" "./$context"
          done

      # Asked of the built image, not read from the Dockerfile: a USER line can
      # be undone by a later stage or a base image, and only the result counts.
      # Root in either image fails the build before anything is published.
      - name: Images do not run as root
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            uid=$(docker run --rm --entrypoint id "$IMAGE_BASE/$image:${{ github.sha }}" -u)
            echo "$image runs as uid $uid"
            test "$uid" != "0"
          done

      # Everything below is skipped on a pull request, where GITHUB_TOKEN is
      # read-only anyway and a push would fail rather than be refused.
      - name: Sign in to the registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # The commit sha is the tag that matters: it is the one a deployment
      # names, and it never moves. `main` is a convenience for "what is on
      # main right now", and a version tag is what a release is cut from.
      #
      # Deliberately no `latest`. A moving tag is how staging and production
      # end up on different images while both claim to be up to date, which is
      # the whole thing rule 12 exists to prevent.
      - name: Publish images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            docker push "$IMAGE_BASE/$image:${{ github.sha }}"
            if [ '${{ github.ref }}' = 'refs/heads/main' ]; then
              docker tag  "$IMAGE_BASE/$image:${{ github.sha }}" "$IMAGE_BASE/$image:main"
              docker push "$IMAGE_BASE/$image:main"
            else
              version='${{ github.ref_name }}'
              docker tag  "$IMAGE_BASE/$image:${{ github.sha }}" "$IMAGE_BASE/$image:$version"
              docker push "$IMAGE_BASE/$image:$version"
            fi
          done

      # So the release step in a deploy can be copied from here rather than
      # reconstructed from memory under pressure.
      - name: Say what was published
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          {
            echo "### Images published"
            echo
            echo '```'
            for image in $IMAGES; do
              echo "$IMAGE_BASE/$image:${{ github.sha }}"
            done
            echo '```'
            if [ "$BUILD_API" != "true" ]; then
              exit 0
            fi
            echo
            echo "Migrate with the same api image before rolling out:"
            echo
            echo '```'
            echo "docker run --rm --env-file <prod.env> \\"
            echo "  -e IMAGES_DIR=/srv/images -v <host images folder>:/srv/images \\"
            echo "  $IMAGE_BASE/api:${{ github.sha }} alembic upgrade head"
            echo '```'
            echo
            echo "The images mount is there because migrations install content as well as"
            echo "schema: 0047 loads the Jr's Corner menu and writes its photographs as"
            echo "files. Without the mount the menu still loads and the photos are left"
            echo "unset -- the migration prints which happened."
          } >> "$GITHUB_STEP_SUMMARY"
