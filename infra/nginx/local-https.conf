# HTTPS on the development laptop: https://<slug>.zenoeats.local:8443
#
# TLS in front of the ordinary development edge (the `nginx` service on
# :8080), which keeps doing all the routing. Nothing about the app changes;
# this is only a padlock, so the storefront, the portals and payments can be
# seen and tried over HTTPS before a real domain exists.
#
# Opt-in, behind its own compose profile:
#   docker compose --profile app --profile https up -d
#
# The certificate is for zenoeats.local and *.zenoeats.local, signed by a
# local certificate authority that can sign nothing else (name constraints).
# See README, "HTTPS on this laptop", for making and trusting it. Production
# HTTPS is infra/nginx/production/, not this.
#
# No HSTS here, deliberately: a browser that saw it would insist on HTTPS for
# zenoeats.local for a year, and the plain :8080 edge would stop working.

server_tokens off;

server {
    listen 8443 ssl default_server;
    # A name that is not ours gets no certificate at all.
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name zenoeats.local *.zenoeats.local;

    # An address typed without "https://" reaches this port as plain HTTP,
    # which nginx answers "400 The plain HTTP request was sent to HTTPS
    # port". 497 is nginx's own code for exactly that case: send the browser
    # to the same address over HTTPS instead. $http_host keeps the :8443.
    error_page 497 =301 https://$http_host$request_uri;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    # Docker's DNS, asked again every few seconds, so a restarted edge -- whose
    # address changes -- is found rather than proxied to where it used to be.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $edge http://nginx:80;

    location / {
        proxy_pass $edge;
        proxy_http_version 1.1;
        # With the port: the pages build links from what the browser used.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
