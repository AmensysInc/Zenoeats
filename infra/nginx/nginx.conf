# Development edge: https://<slug>.zenoeats.local:8443, and nothing else.
# There is no plain-HTTP listener. Production is infra/nginx/production/,
# not this.
#
# The certificate is for zenoeats.local and *.zenoeats.local, signed by a
# local certificate authority that can sign nothing else (name constraints).
# nginx will not start without it: run `bash scripts/local_https_cert.sh`
# once (README, "Running it"), which writes infra/certs-local/.

# Prefer container networking when the app profile is running. Docker DNS
# refreshes addresses after container recreation; the host gateway remains a
# backup for native development. Never send Docker traffic through Windows
# port forwarding unnecessarily: that extra hop can intermittently stall.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# Timings distinguish a slow application from connection/proxy failures.
# Omit query strings, cookies and bodies (they may contain customer tokens).
# The version number tells a scanner which advisories to try first.
server_tokens off;

log_format upstream_timing '$remote_addr $request_method $uri status=$status '
    'seconds=$request_time upstream=$upstream_addr '
    'connect=$upstream_connect_time header=$upstream_header_time '
    'response=$upstream_response_time';

# The port the browser connected to, off the Host header. A Host with no port
# means the browser used the HTTPS default.
map $http_host $client_port {
    default                 "443";
    "~^[^:]+:(?<port>\d+)$" $port;
}

# Only a real websocket handshake may carry Connection: upgrade. Sending it on
# every request -- which is what a hard-coded `Connection "upgrade"` does --
# tells the upstream each plain GET is a protocol switch, so the connection is
# neither reused nor cleanly closed. Against the Vite dev server that stalls
# module requests until the browser gives up on its six connections, and the
# page's own /api calls, queued behind them, time out.
#
# The ordinary case is an EMPTY value, not "close". Empty makes nginx omit the
# header, which is the only thing that lets it reuse a pooled upstream
# connection; "close" tells the upstream to hang up after every response, which
# silently made the `keepalive 64` in zenoeats_web below do nothing. A dev page
# load is hundreds of module requests, and each was paying its own TCP
# handshake. This is the same pair of headers /api/ already sets by hand.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

map $http_host $restaurant_slug {
    default "";
    "~^(?<slug>[a-z0-9-]+)\.zenoeats\.local(:\d+)?$" $slug;
}

# Keep pooled connections below the servers' idle timeouts. Shared zones are
# required for dynamic DNS resolution (nginx >= 1.27.3).
upstream zenoeats_api {
    zone zenoeats_api 64k;
    server api:8000 resolve;
    server zenoeats-host:8000 backup;
    keepalive 32;
    keepalive_timeout 3s;
    keepalive_requests 1000;
}

upstream zenoeats_web {
    zone zenoeats_web 64k;
    server web:3000 resolve;
    server zenoeats-host:3000 backup;
    keepalive 64;
    keepalive_timeout 3s;
    keepalive_requests 1000;
}

server {
    listen 8443 ssl default_server;
    # A name that is not ours gets no certificate at all.
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    access_log /var/log/nginx/access.log upstream_timing;
    server_name ~^.*\.zenoeats\.local$ zenoeats.local;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # An address typed as http://...:8443 reaches this port as plain HTTP,
    # which nginx answers "400 The plain HTTP request was sent to HTTPS
    # port". 497 is nginx's own code for exactly that case: send the browser
    # to the same address over HTTPS instead. $http_host keeps the :8443.
    #
    # No HSTS, deliberately: a browser that saw it would refuse plain HTTP to
    # every zenoeats.local port for a year, including the Vite dev server on
    # :3000 when debugged directly.
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The API and the web container send these three too; drop their copies
    # so each header arrives once. Same as the production edge.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    location /api/ {
        proxy_pass http://zenoeats_api;
        # Keepalive to the upstream needs HTTP/1.1 and an empty Connection
        # header; anything else closes the connection after every response.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host, not $host: $host drops the port, and the app builds
        # absolute URLs from what it receives here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended to: $proxy_add_x_forwarded_for would keep
        # whatever the client sent in front of the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;
        # The application resolves the tenant from Host. Passing it through
        # unmodified is what makes wildcard subdomains work. The slug header
        # is the fallback the API accepts when Host carries no subdomain.
        proxy_set_header X-Zenoeats-Restaurant $restaurant_slug;
        proxy_read_timeout 30s;
    }

    # Uploaded images are served by FastAPI, including when the frontend is
    # the static Docker image rather than Vite's development proxy.
    location ^~ /images/ {
        proxy_pass http://zenoeats_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://zenoeats_api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Same rule as production: the platform portal is only served at
    # admin.zenoeats.local, so a hostname that would 404 at the API does not
    # first render a sign-in form here.
    location ^~ /admin {
        if ($host != admin.zenoeats.local) {
            return 404;
        }
        proxy_pass http://zenoeats_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://zenoeats_web;
        # $http_host preserves ":8443". With $host the port is stripped, and
        # every absolute URL the app and Clerk generate points at port 443 --
        # including the return from Google sign-in, which then lands on a
        # port nothing is listening on.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $client_port;

        # The dev server uses a websocket for hot reload. Without these two
        # headers every code change fails to push to the browser.
        # $connection_upgrade is "upgrade" only for an actual handshake and
        # empty otherwise, so an ordinary request is neither mistaken for a
        # protocol switch nor forced to close the connection it arrived on.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

