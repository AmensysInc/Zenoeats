# Host nginx site for the Zenoeats staging stack.
#
# Copy to the same place the other staging apps are proxied (the file that
# mentions 127.0.0.1:3015 is the pattern), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS, both pointing at this VPS:
#   stg9.zenoeats.com
#   *.stg9.zenoeats.com
#
# The certificate must cover both names. A single-name certificate for
# stg9.zenoeats.com does not cover spicehouse.stg9.zenoeats.com.
# Issue it with a DNS challenge, then point the two ssl_ lines at it.
#
# The app containers listen on 127.0.0.1:8099 only. They do not bind 80
# or 443, so the sites already on this VPS keep those ports.

server {
    listen 80;
    listen [::]:80;
    server_name stg9.zenoeats.com *.stg9.zenoeats.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stg9.zenoeats.com *.stg9.zenoeats.com;

    ssl_certificate     /etc/letsencrypt/live/stg9.zenoeats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg9.zenoeats.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
