# Host nginx site for the Zenoeats production stack on 93.127.132.173.
#
#   sudo cp infra/nginx/production/vps-zenoeats.com.conf /etc/nginx/sites-available/zenoeats.com
#   sudo ln -s /etc/nginx/sites-available/zenoeats.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS, both pointing at this VPS:
#   zenoeats.com
#   *.zenoeats.com
#
# The certificate must cover both names, so it is issued with a DNS
# challenge:
#   sudo certbot certonly --manual --preferred-challenges dns \
#     -d zenoeats.com -d '*.zenoeats.com'
#
# The app containers listen on 127.0.0.1:8100 only. They do not bind 80 or
# 443, so the sites already on this VPS keep those ports.

server {
    listen 80;
    listen [::]:80;
    server_name zenoeats.com *.zenoeats.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zenoeats.com *.zenoeats.com;

    ssl_certificate     /etc/letsencrypt/live/zenoeats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zenoeats.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, not appended to: nothing a client sends survives into
        # the API's rate limiter or logs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
